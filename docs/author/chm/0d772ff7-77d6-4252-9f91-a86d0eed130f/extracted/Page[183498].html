<p>Classes are a method used for sorting tables, fields, and groups.</p>
<p>To set the value of the Class property:</p>
<ol> <li>Click the field or group.</li> <li>On the <strong>Value</strong> tab, click <strong>Class</strong>, and then enter a name for the class.</li>
</ol></div>
