<p>A Comment is information about the field that may be useful for documentation purposes.</p>
<p>To set the value of the Comment property:</p>
<ol> <li>Click the field.</li> <li>On the <strong>Value</strong> tab, click <strong>Comment</strong>, and then enter the comment text.</li>
</ol></div>
